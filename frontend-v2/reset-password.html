<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reset password — stockportfolio.pro</title>
  <meta name="description" content="Choose a new password for your stockportfolio.pro account." />
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/Media/icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..750&display=swap" />
  <link rel="stylesheet" href="assets/system.css?v=20260830-mob2" />
</head>
<body>
  <main>
    <div class="container" style="max-width:420px; padding-top:72px;">
      <h1 class="title-1">Choose a new password</h1>
      <p class="muted small" style="margin-top:6px;">Pick a strong password you don't use elsewhere.</p>
      <form id="reset-form" class="card card-pad" style="display:grid; gap:14px; margin-top:24px;">
        <label class="field"><span>New password</span><input class="input" id="password" type="password" autocomplete="new-password" required /></label>
        <label class="field"><span>Confirm new password</span><input class="input" id="confirm" type="password" autocomplete="new-password" required /></label>
        <p class="small faint" style="margin:-4px 0 0;">At least 8 characters, with an uppercase letter, a lowercase letter, and a number.</p>
        <button class="btn btn-primary" type="submit" id="submit">Reset password</button>
        <p class="small delta-neg" id="error" role="alert" hidden></p>
      </form>
      <div id="done" class="card card-pad" style="margin-top:24px; display:none;">
        <p class="small" id="done-msg" role="status" aria-live="polite" style="margin:0;"></p>
      </div>
      <p class="small muted" style="margin-top:16px;"><a href="/login.html">Back to log in</a></p>
    </div>
  </main>
  <script src="assets/app.js?v=20260830-mob2"></script>
  <script>
    V2.nav('login');
    const token = new URLSearchParams(location.search).get('token') || '';
    const form = document.getElementById('reset-form');
    const err = document.getElementById('error');

    if (!token) {
      form.style.display = 'none';
      document.getElementById('done-msg').innerHTML =
        'This reset link is missing its token. <a href="/forgot-password.html">Request a new link</a>.';
      document.getElementById('done').style.display = 'block';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submit');
      const pw = document.getElementById('password').value;
      const confirm = document.getElementById('confirm').value;
      err.hidden = true;
      if (pw !== confirm) {
        err.textContent = 'Passwords do not match.';
        err.hidden = false;
        return;
      }
      btn.disabled = true;
      try {
        const r = await fetch(`${V2.API}/password/reset`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, newPassword: pw })
        });
        const data = await r.json().catch(() => ({}));
        if (r.ok && data.token) {
          location.href = '/dashboard.html';
        } else {
          err.textContent = data.message || 'Could not reset your password. The link may have expired.';
          err.hidden = false;
          btn.disabled = false;
        }
      } catch (_) {
        err.textContent = 'Network problem — please try again.';
        err.hidden = false;
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
