<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Forgot password — stockportfolio.pro</title>
  <meta name="description" content="Reset your stockportfolio.pro password." />
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/Media/icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..750&display=swap" />
  <link rel="stylesheet" href="assets/system.css?v=20260829-askmem2" />
</head>
<body>
  <main>
    <div class="container" style="max-width:420px; padding-top:72px;">
      <h1 class="title-1">Forgot password</h1>
      <p class="muted small" style="margin-top:6px;">Enter your email and we'll send you a link to reset it.</p>
      <form id="forgot-form" class="card card-pad" style="display:grid; gap:14px; margin-top:24px;">
        <label class="field"><span>Email</span><input class="input" id="email" type="email" autocomplete="email" required /></label>
        <button class="btn btn-primary" type="submit" id="submit">Send reset link</button>
        <p class="small delta-neg" id="error" role="alert" hidden></p>
      </form>
      <div id="done" class="card card-pad" style="margin-top:24px; display:none;">
        <p class="small" id="done-msg" role="status" aria-live="polite" style="margin:0;"></p>
      </div>
      <p class="small muted" style="margin-top:16px;">Remembered it? <a href="/login.html">Back to log in</a>.</p>
    </div>
  </main>
  <script src="assets/app.js?v=20260829-askmem2"></script>
  <script>
    V2.nav('login');
    document.getElementById('forgot-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submit');
      const err = document.getElementById('error');
      btn.disabled = true; err.hidden = true;
      try {
        const r = await fetch(`${V2.API}/password/forgot`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: document.getElementById('email').value.trim() })
        });
        const data = await r.json().catch(() => ({}));
        if (r.ok) {
          document.getElementById('forgot-form').style.display = 'none';
          document.getElementById('done-msg').textContent =
            data.message || "If an account exists for that email, a password reset link is on its way.";
          document.getElementById('done').style.display = 'block';
        } else {
          err.textContent = data.message || 'Something went wrong — please try again.';
          err.hidden = false;
          btn.disabled = false;
        }
      } catch (_) {
        err.textContent = 'Network problem — please try again.';
        err.hidden = false;
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
