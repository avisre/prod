<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Log in — stockportfolio.pro</title>
  <meta name="description" content="Log in to your stockportfolio.pro account." />
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/Media/icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..750&display=swap" />
  <link rel="stylesheet" href="assets/system.css?v=20260903-paywall1" />
</head>
<body>
  <main>
    <div class="container" style="max-width:420px; padding-top:72px;">
      <h1 class="title-1">Log in</h1>
      <p class="muted small" style="margin-top:6px;">Welcome back.</p>
      <form id="login-form" class="card card-pad" style="display:grid; gap:14px; margin-top:24px;">
        <label class="field"><span>Email</span><input class="input" id="email" type="email" autocomplete="email" required /></label>
        <label class="field"><span>Password</span><input class="input" id="password" type="password" autocomplete="current-password" required /></label>
        <p class="small" style="margin:-4px 0 0; text-align:right;"><a href="/forgot-password.html">Forgot password?</a></p>
        <button class="btn btn-primary" type="submit" id="submit">Log in</button>
        <div id="social-shell" hidden style="display:grid; gap:10px;">
          <div style="display:flex; align-items:center; gap:10px;">
            <span style="flex:1; height:1px; background:var(--line-strong);"></span>
            <span class="small faint">or</span>
            <span style="flex:1; height:1px; background:var(--line-strong);"></span>
          </div>
          <div id="google-btn"></div>
          <p class="small muted" id="social-status" role="status" aria-live="polite" hidden></p>
        </div>
        <p class="small delta-neg" id="error" role="alert" hidden></p>
      </form>
      <p class="small muted" style="margin-top:16px;">New here? <a href="/register.html">Choose a plan and continue to secure checkout</a>.</p>
    </div>
  </main>
  <script src="assets/app.js?v=20260903-paywall1"></script>
  <script src="assets/social.js?v=20260831-paidfirst1"></script>
  <script>
    V2.nav('login');
    // Keep users on the page that requested authentication, but never allow
    // an absolute or protocol-relative URL to become an open redirect.
    function safeNextPath(raw) {
      const fallback = 'dashboard.html';
      const value = String(raw || '').trim();
      if (!value || value.includes('\\') || /^[a-z][a-z0-9+.-]*:/i.test(value) || value.startsWith('//')) return fallback;
      try {
        const target = new URL(value, window.location.origin);
        if (target.origin !== window.location.origin) return fallback;
        return `${target.pathname.replace(/^\/+/, '')}${target.search}${target.hash}` || fallback;
      } catch (_) {
        return fallback;
      }
    }
    const nextAfterLogin = safeNextPath(new URLSearchParams(window.location.search).get('next'));
    // Stripe sends social-login checkouts back here (?session=success&checkout=social).
    V2Social.confirmCheckout({ statusId: 'social-status' }) &&
      (document.getElementById('social-shell').hidden = false);
    V2Social.init({
      flow: 'login',
      shellId: 'social-shell',
      mountId: 'google-btn',
      statusId: 'social-status',
      next: nextAfterLogin
    });
    // A pending paid-first account can resume checkout from this page. After
    // Stripe returns, wait for the webhook to activate access before redirect.
    (async function confirmEmailCheckout() {
      const params = new URLSearchParams(window.location.search);
      if (params.get('session') !== 'success' || params.get('checkout') === 'social') return;
      const status = document.getElementById('error');
      status.hidden = false;
      status.classList.remove('delta-neg');
      status.textContent = 'Payment received — activating your account…';
      for (let attempt = 0; attempt < 6; attempt++) {
        try {
          const r = await fetch(`${V2.API}/session`);
          const body = await r.json().catch(() => ({}));
          if (r.ok && body.subscription && body.subscription.isActive) { location.href = '/' + nextAfterLogin; return; }
        } catch (_) { /* transient */ }
        await new Promise((resolve) => setTimeout(resolve, 3000));
      }
      status.classList.add('delta-neg');
      status.textContent = 'Payment completed, but activation is taking a moment. Please try logging in again shortly.';
    })();
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submit');
      const err = document.getElementById('error');
      btn.disabled = true; err.hidden = true;
      try {
        const r = await fetch(`${V2.API}/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value.trim(),
            password: document.getElementById('password').value
          })
        });
        const data = await r.json().catch(() => ({}));
        if (r.ok && data.url) {
          location.href = data.url;
        } else if (r.ok && data.token) {
          location.href = '/' + nextAfterLogin;
        } else {
          err.textContent = data.message || 'Invalid email or password.';
          err.hidden = false;
        }
      } catch (_) {
        err.textContent = 'Network problem — please try again.';
        err.hidden = false;
      } finally { btn.disabled = false; }
    });
  </script>
</body>
</html>
