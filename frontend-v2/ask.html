  <script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Ask — the SEC-grounded AI analyst","url":"https://www.stockportfolio.pro/ask","applicationCategory":"FinanceApplication","operatingSystem":"Web","description":"An AI research assistant that answers questions about US-listed companies using their SEC filings, with sources shown for every figure."}</script>

  <link rel="stylesheet" href="assets/system.css?v=20260615-7" />
  <style>
    /* the canvas: one centred column, generous air */
    .canvas { max-width: 800px; margin: 0 auto; min-height: calc(100vh - 220px); display: flex; flex-direction: column; }

    /* empty state — a greeting, the composer mid-screen, quiet prompts */
    .hello { text-align: center; margin: 18vh 0 36px; }
    .hello h1 { font-size: clamp(28px, 4vw, 40px); font-weight: 650; letter-spacing: -0.025em; }
    .hello p { margin-top: 10px; color: var(--ink-3); font-size: 14px; }

    /* the composer — one soft instrument, centred; docks to the floor in conversation */
    .composer { position: relative; width: 100%; }
    .composer textarea {
      width: 100%; resize: none; display: block;
      min-height: 92px; padding: 18px 64px 18px 22px;
      font: inherit; font-size: 15.5px; line-height: 1.5; color: var(--ink);
      background: var(--surface);
      border: 1px solid var(--line-strong); border-radius: 18px;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .composer textarea:focus { border-color: var(--ink-3); box-shadow: 0 2px 24px rgba(28, 27, 24, 0.06); }
    .composer textarea::placeholder { color: var(--ink-3); }
    .composer .go {
      position: absolute; right: 14px; bottom: 14px;
      width: 38px; height: 38px; border-radius: 50%; border: 0;
      background: var(--ink); color: var(--paper); cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center;
      transition: opacity 0.15s ease;
    }
    .composer .go:disabled { opacity: 0.25; cursor: default; }
    .composer-foot { margin-top: 10px; text-align: center; font-size: 11.5px; color: var(--ink-3); }

    .prompts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 28px; }
    .prompts button {
      text-align: left; border: 1px solid var(--line); background: none; border-radius: 12px;
      padding: 13px 16px; font-size: 13.5px; color: var(--ink-2); cursor: pointer; font-family: inherit;
      transition: border-color 0.12s ease, color 0.12s ease;
    }
    .prompts button:hover { border-color: var(--ink-3); color: var(--ink); }
    @media (max-width: 640px) { .prompts { grid-template-columns: 1fr; } }

    /* conversation state */
    body.in-conversation .hello, body.in-conversation .prompts { display: none; }
    .thread { flex: 1; padding: 40px 0 40px; }
    .composer-dock { position: sticky; bottom: 0; padding: 12px 0 22px; background: linear-gradient(transparent, var(--paper) 30%); }
    body:not(.in-conversation) .composer-dock { position: static; background: none; padding: 0; }
  </style>
</head>
<body>
  <main>
    <div class="container">
      <div class="canvas">
        <div class="hello">
          <h1>Ask anything.</h1>
          <p>Every figure comes from SEC filings — never from memory.</p>
        </div>

        <div class="thread" id="thread" hidden><div class="ask-exchange" id="exchange"></div></div>

        <div class="composer-dock">
          <form class="composer" id="composer">
            <textarea id="q" rows="2" maxlength="1000" placeholder="Ask about any company, a comparison, a screen, or your portfolio…" aria-label="Ask a question"></textarea>
            <button class="go" type="submit" aria-label="Ask" disabled>
              <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 13V3m0 0L3.5 7.5M8 3l4.5 4.5"/></svg>
            </button>
          </form>
          <p class="composer-foot" id="quota-line">Describes and explains — never buy/sell advice. Sources under every answer.</p>
        </div>

        <div class="prompts" id="prompts">
          <button>Walk me through NVDA's last 10 years — growth, margins, and what changed.</button>
          <button>Compare COST and WMT on growth, margins and returns over 10 years.</button>
          <button>Run the health checks on TSLA and explain every failure.</button>
          <button>Which of V and MA converts more revenue into free cash flow?</button>
          <button>Find companies that grew revenue 10%+ a year with net margins above 20%.</button>
          <button>Is my portfolio concentrated, and which holding is fundamentally weakest?</button>
        </div>
      </div>
    </div>
  </main>
  <script src="assets/app.js?v=20260615-7"></script>
  <script>
    (function () {
      const { API, token, nav, footer, askEngine } = window.V2;
      nav('ask');
      footer();
      const $ = (id) => document.getElementById(id);
      const ta = $('q');
      const go = document.querySelector('.composer .go');
      const engine = askEngine($('exchange'), {
        onActivity: () => {
          document.body.classList.add('in-conversation');
          $('thread').hidden = false;
        }
      });
      function submit() {
        const q = ta.value.trim();
        if (!q) return;
        ta.value = '';
        go.disabled = true;
        engine.send(q);
      }
      $('composer').addEventListener('submit', (e) => { e.preventDefault(); submit(); });
      ta.addEventListener('input', () => { go.disabled = !ta.value.trim(); });
      ta.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submit(); }
      });
      document.querySelectorAll('.prompts button').forEach((b) =>
        b.addEventListener('click', () => {
          document.body.classList.add('in-conversation');
          $('thread').hidden = false;
          engine.send(b.textContent);
        }));
      ta.focus();
      // quota line — replaces the static note once known
      (async () => {
        const el = $('quota-line');
        if (!token()) {
          el.innerHTML = 'You’ll need an account — <a href="/login.html">log in</a> or <a href="/register.html">start a 7-day free trial</a>.';
          return;
        }
        try {
          const r = await fetch(`${API}/ai/chat/quota`, { headers: { Authorization: `Bearer ${token()}` } });
          if (r.ok) {
            const q2 = await r.json();
            el.textContent = `${Math.max(0, q2.limit - q2.used)} of ${q2.limit} questions left this month${q2.pro ? ' · Pro' : ''} · never buy/sell advice`;
          }
        } catch (_) { /* best-effort */ }
      })();
    })();
  </script>
</body>
</html>
