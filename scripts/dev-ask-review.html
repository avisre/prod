<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Local Ask answer review</title>
  <link rel="stylesheet" href="/assets/system.css">
  <style>
    body { padding:32px 20px; }
    main { max-width:900px; margin:auto; }
    header { margin-bottom:28px; }
    h1 { margin-bottom:8px; }
    .review-controls { display:flex; gap:10px; flex-wrap:wrap; margin:16px 0; }
    .review-card { padding:24px; margin:20px 0; border:1px solid var(--line); border-radius:14px; background:var(--surface); min-width:0; }
    .review-meta { display:flex; flex-wrap:wrap; gap:8px 18px; margin:12px 0 20px; font-size:13px; color:var(--ink-2); }
    .review-question { white-space:pre-wrap; overflow-wrap:anywhere; }
    textarea { width:100%; resize:vertical; min-height:110px; padding:12px; border:1px solid var(--line); border-radius:8px; font:inherit; color:var(--ink); background:var(--surface); }
    button, select { font:inherit; }
    button { cursor:pointer; }
    button:disabled { opacity:.5; cursor:wait; }
    .ask-a { overflow-wrap:anywhere; }
    .ask-a > :first-child { margin-top:0; }
    .ask-a > :last-child { margin-bottom:0; }
    .review-status { min-height:24px; }
    .review-card h2 { font-size:22px; }
    details { margin:12px 0; }
    summary { cursor:pointer; }
    @media(max-width:600px) { body { padding:20px 12px; } .review-card { padding:16px; } }
  </style>
</head>
<body>
<main>
  <header>
    <p class="label">Local Ask preview</p>
    <h1>Check the answer, charts and length</h1>
    <p>Actual model responses, shown with the product’s renderer. Generate an example or ask your own question.</p>
    <div class="review-controls">
      <button class="btn" type="button" data-example="short">Generate short answer</button>
      <button class="btn" type="button" data-example="complex">Generate complex answer</button>
    </div>
  </header>
  <section class="review-card" aria-labelledby="custom-heading">
    <h2 id="custom-heading">Try your own question</h2>
    <form id="custom-form">
      <label for="question">Question</label>
      <textarea id="question" maxlength="8000" required placeholder="For Apple, compare revenue and free cash flow over the last three annual periods. Show a chart and cite SEC sources."></textarea>
      <div class="review-controls">
        <label for="mode">Mode</label>
        <select id="mode"><option value="normal">Simple</option><option value="analyst">Analyst</option></select>
        <label><input type="checkbox" id="followup"> Follow up on the last custom answer</label>
        <button class="btn" type="submit">Ask</button>
      </div>
    </form>
    <p id="status" class="review-status" role="status" aria-live="polite">Connecting…</p>
    <div id="custom-output"></div>
  </section>
  <section class="review-card" id="short-card"><h2>Short answer</h2><div id="short-output"><p>Generate the short example above.</p></div></section>
  <section class="review-card" id="complex-card"><h2>Complex answer</h2><div id="complex-output"><p>Generate the complex example above.</p></div></section>
</main>
<script src="/assets/app.js"></script>
<script>
(() => {
  const status = document.getElementById('status');
  let history = [], busy = false;
  const esc = text => String(text).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const words = text => text.trim().split(/\s+/).filter(Boolean).length;
  function render(result, target) {
    target.innerHTML = `<details><summary>Question · ${esc(result.mode === 'normal' ? 'Simple' : 'Analyst')}</summary><p class="review-question">${esc(result.question)}</p></details><div class="review-meta"></div><div class="ask-a${result.mode === 'normal' ? ' is-normal' : ''}">${V2.markdown(result.answer || '')}</div>`;
    const answer = target.querySelector('.ask-a');
    const prose = String(result.answer || '').replace(/```[\s\S]*?```/g,'').replace(/\[([^\]]+)\]\([^)]*\)/g,'$1');
    target.querySelector('.review-meta').textContent = `${words(answer.innerText)} displayed words · ${words(prose)} prose/table words · ${answer.querySelectorAll('.ask-viz').length} charts · ${(result.ms / 1000).toFixed(1)}s · ${result.source === 'ai' ? 'Model answer' : 'Partial or unavailable answer'}${result.quality?.rewritten ? ' · rewritten after checks' : ''}`;
    target.querySelectorAll('.ask-next').forEach(button => button.addEventListener('click', () => {
      if (busy) return;
      history = [{role:'user',content:result.question},{role:'assistant',content:result.answer}];
      document.getElementById('question').value = button.dataset.q;
      document.getElementById('mode').value = result.mode;
      document.getElementById('followup').checked = true;
      document.getElementById('custom-heading').scrollIntoView({behavior:'smooth'});
      document.getElementById('custom-form').requestSubmit();
    }));
    window.dispatchEvent(new Event('resize'));
  }
  function handleEvent(type, data, progress) {
    if (type === 'tool') {
      const name = data.name || data.tool || '';
      progress.textContent = name ? `Researching · ${name}` : 'Researching…';
    } else if (type === 'done') return data;
    else if (type === 'error') throw Error(data.message || 'Answer failed.');
    else if (type === 'delta') progress.textContent = 'Preparing the checked answer…';
    return null;
  }
  async function generate(body, target) {
    if (busy) return;
    busy = true;
    document.querySelectorAll('button').forEach(b => b.disabled = true);
    status.textContent = 'Researching and writing…';
    target.innerHTML = '<p role="status" class="pending">Researching and writing…</p>';
    const progress = target.querySelector('.pending');
    try {
      const response = await fetch('/api/ask', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({...body,stream:true}) });
      if (!response.ok) { const error = await response.json(); throw Error(error.message || 'Request failed.'); }
      const reader = response.body.getReader(), decoder = new TextDecoder();
      let buffer = '', result;
      for (;;) {
        const {value,done} = await reader.read();
        buffer += decoder.decode(value, {stream:!done});
        let boundary;
        while ((boundary = buffer.indexOf('\n\n')) >= 0) {
          const packet = buffer.slice(0,boundary); buffer = buffer.slice(boundary+2);
          const type = packet.match(/^event: (.+)$/m)?.[1], payload = packet.match(/^data: (.+)$/m)?.[1];
          if (type && payload) result = handleEvent(type,JSON.parse(payload),progress) || result;
        }
        if (done) break;
      }
      if (!result) throw Error('The connection closed before the answer finished.');
      render(result,target);
      if (!body.example) history = (body.history || []).concat({role:'user',content:result.question},{role:'assistant',content:result.answer}).slice(-10);
      status.textContent = 'Answer ready. You can ask another question.';
    } catch (error) { status.textContent = error.message; target.textContent = error.message; }
    finally { busy = false; document.querySelectorAll('button').forEach(b => b.disabled = false); }
  }
  document.querySelectorAll('[data-example]').forEach(button => button.addEventListener('click',() => generate({example:button.dataset.example},document.getElementById(button.dataset.example+'-output'))));
  document.getElementById('custom-form').addEventListener('submit',event => {
    event.preventDefault();
    generate({question:document.getElementById('question').value,mode:document.getElementById('mode').value,history:document.getElementById('followup').checked ? history : []},document.getElementById('custom-output'));
  });
  Promise.all([fetch('/api/health').then(r=>r.json()),fetch('/api/examples').then(r=>r.json())]).then(([health,saved])=>{
    status.textContent = health.configured ? 'Ready. Choose an example or enter a question.' : 'The local AI connection is not configured.';
    for (const [id,result] of Object.entries(saved.examples)) render(result,document.getElementById(id+'-output'));
    window.__reviewReady = true;
  }).catch(()=>{status.textContent='Could not connect to the local backend.';});
})();
</script>
</body>
</html>
