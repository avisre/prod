<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgUp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1218"/>
      <stop offset="55%" stop-color="#10161e"/>
      <stop offset="100%" stop-color="#1a2330"/>
    </linearGradient>
    <radialGradient id="glowUp" cx="0.78" cy="0.20" r="0.55">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.34"/>
      <stop offset="65%" stop-color="#22c55e" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="areaUp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#22c55e" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="lineUp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="45%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#86efac"/>
    </linearGradient>
    <filter id="lineGlow" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="dotGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bgUp)"/>
  <rect width="800" height="500" fill="url(#glowUp)"/>

  <!-- Faint dot grid -->
  <g fill="#2a313d" opacity="0.55">
    <g>
      <circle cx="60"  cy="120" r="1"/>
      <circle cx="160" cy="120" r="1"/>
      <circle cx="260" cy="120" r="1"/>
      <circle cx="360" cy="120" r="1"/>
      <circle cx="460" cy="120" r="1"/>
      <circle cx="560" cy="120" r="1"/>
      <circle cx="660" cy="120" r="1"/>
      <circle cx="760" cy="120" r="1"/>
    </g>
    <g>
      <circle cx="60"  cy="220" r="1"/>
      <circle cx="160" cy="220" r="1"/>
      <circle cx="260" cy="220" r="1"/>
      <circle cx="360" cy="220" r="1"/>
      <circle cx="460" cy="220" r="1"/>
      <circle cx="560" cy="220" r="1"/>
      <circle cx="660" cy="220" r="1"/>
      <circle cx="760" cy="220" r="1"/>
    </g>
    <g>
      <circle cx="60"  cy="320" r="1"/>
      <circle cx="160" cy="320" r="1"/>
      <circle cx="260" cy="320" r="1"/>
      <circle cx="360" cy="320" r="1"/>
      <circle cx="460" cy="320" r="1"/>
      <circle cx="560" cy="320" r="1"/>
      <circle cx="660" cy="320" r="1"/>
      <circle cx="760" cy="320" r="1"/>
    </g>
  </g>

  <!-- Subtle candlestick shadows behind the line -->
  <g opacity="0.45">
    <rect x="115" y="350" width="6" height="40" rx="1" fill="#22c55e"/>
    <rect x="195" y="320" width="6" height="50" rx="1" fill="#22c55e"/>
    <rect x="275" y="290" width="6" height="38" rx="1" fill="#22c55e"/>
    <rect x="355" y="260" width="6" height="44" rx="1" fill="#22c55e"/>
    <rect x="435" y="230" width="6" height="32" rx="1" fill="#22c55e"/>
    <rect x="515" y="195" width="6" height="40" rx="1" fill="#22c55e"/>
    <rect x="595" y="165" width="6" height="35" rx="1" fill="#22c55e"/>
    <rect x="675" y="135" width="6" height="32" rx="1" fill="#22c55e"/>
  </g>

  <!-- Gradient area -->
  <path d="M0,420 L80,400 L160,365 L240,328 L320,300 L400,255 L480,232 L560,180 L640,150 L720,108 L800,82 L800,500 L0,500 Z" fill="url(#areaUp)"/>

  <!-- Glowing trend line -->
  <path d="M0,420 L80,400 L160,365 L240,328 L320,300 L400,255 L480,232 L560,180 L640,150 L720,108 L800,82"
        fill="none" stroke="url(#lineUp)" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" filter="url(#lineGlow)"/>

  <!-- Markers along the line -->
  <g fill="#22c55e">
    <circle cx="240" cy="328" r="4"/>
    <circle cx="400" cy="255" r="4"/>
    <circle cx="560" cy="180" r="4"/>
  </g>
  <!-- Endpoint pulse -->
  <g>
    <circle cx="800" cy="82" r="14" fill="#22c55e" opacity="0.18"/>
    <circle cx="800" cy="82" r="9"  fill="#22c55e" opacity="0.4"/>
    <circle cx="800" cy="82" r="5"  fill="#dcfce7" filter="url(#dotGlow)"/>
  </g>

  <!-- Top-left chip -->
  <g transform="translate(40 40)">
    <rect width="118" height="30" rx="6" fill="#0f1115" stroke="#26282e"/>
    <circle cx="14" cy="15" r="5" fill="#22c55e"/>
    <text x="26" y="20" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#dcfce7">RALLY</text>
    <text x="78" y="20" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#86efac">+12.4%</text>
  </g>

  <!-- Top-right tickers -->
  <g font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#a3a6ad" letter-spacing="2">
    <text x="760" y="58" text-anchor="end">MARKET PULSE</text>
  </g>
</svg>
