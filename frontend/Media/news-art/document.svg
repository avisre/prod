<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgDoc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d111a"/>
      <stop offset="100%" stop-color="#181b25"/>
    </linearGradient>
    <radialGradient id="docGlow" cx="0.5" cy="0.55" r="0.45">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="paperBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2d36"/>
      <stop offset="100%" stop-color="#1f2127"/>
    </linearGradient>
    <linearGradient id="paperMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34373f"/>
      <stop offset="100%" stop-color="#262830"/>
    </linearGradient>
    <linearGradient id="paperTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#42454e"/>
      <stop offset="100%" stop-color="#2f323a"/>
    </linearGradient>
    <linearGradient id="miniBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <filter id="paperShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="6"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bgDoc)"/>
  <rect width="800" height="500" fill="url(#docGlow)"/>

  <!-- Stacked sheets, slight rotation per sheet -->
  <g transform="translate(0 0)">
    <g filter="url(#paperShadow)" transform="translate(330 90) rotate(4)">
      <rect width="320" height="380" rx="6" fill="url(#paperBack)" stroke="#3a3d45" stroke-width="1"/>
    </g>
    <g filter="url(#paperShadow)" transform="translate(290 76) rotate(-2)">
      <rect width="320" height="380" rx="6" fill="url(#paperMid)" stroke="#43464f" stroke-width="1"/>
    </g>
    <g filter="url(#paperShadow)" transform="translate(248 60) rotate(1)">
      <rect width="320" height="380" rx="6" fill="url(#paperTop)" stroke="#52555f" stroke-width="1"/>
      <!-- Header -->
      <g transform="translate(20 20)">
        <rect width="56" height="14" rx="3" fill="#3b82f6"/>
        <rect x="64" y="2" width="8" height="10" rx="2" fill="#22c55e"/>
        <rect width="160" height="10" rx="3" fill="#a3a6ad" y="26"/>
        <rect width="220" height="6" rx="2" fill="#5e6168" y="42"/>
      </g>
      <!-- Mini chart card -->
      <g transform="translate(20 90)">
        <rect width="280" height="100" rx="6" fill="#1c1f27" stroke="#2c2f37"/>
        <text x="14" y="22" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="700" fill="#a3a6ad" letter-spacing="2">REVENUE TREND</text>
        <text x="14" y="46" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="800" fill="#f5f5f5">$1.84B</text>
        <text x="86" y="46" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#22c55e">+8.4%</text>
        <!-- Mini bars -->
        <g transform="translate(150 62)">
          <rect x="0"   y="22" width="10" height="20" rx="1" fill="url(#miniBar)"/>
          <rect x="14"  y="14" width="10" height="28" rx="1" fill="url(#miniBar)"/>
          <rect x="28"  y="8"  width="10" height="34" rx="1" fill="url(#miniBar)"/>
          <rect x="42"  y="18" width="10" height="24" rx="1" fill="url(#miniBar)"/>
          <rect x="56"  y="6"  width="10" height="36" rx="1" fill="url(#miniBar)"/>
          <rect x="70"  y="2"  width="10" height="40" rx="1" fill="#60a5fa"/>
          <rect x="84"  y="10" width="10" height="32" rx="1" fill="url(#miniBar)"/>
          <rect x="98"  y="0"  width="10" height="42" rx="1" fill="#60a5fa"/>
          <rect x="112" y="6"  width="10" height="36" rx="1" fill="url(#miniBar)"/>
        </g>
      </g>
      <!-- Body lines -->
      <g transform="translate(20 210)" fill="#5a5d65">
        <rect width="280" height="6" rx="3"/>
        <rect width="260" height="6" rx="3" y="14"/>
        <rect width="270" height="6" rx="3" y="28"/>
        <rect width="200" height="6" rx="3" y="42"/>
      </g>
      <!-- Grid of stat tiles -->
      <g transform="translate(20 280)">
        <rect width="130" height="38" rx="4" fill="#1c1f27" stroke="#2c2f37"/>
        <text x="10" y="14" font-family="Inter, system-ui, sans-serif" font-size="8" font-weight="700" fill="#7c7f86" letter-spacing="2">EPS</text>
        <text x="10" y="30" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" fill="#f5f5f5">$2.18</text>

        <rect x="150" width="130" height="38" rx="4" fill="#1c1f27" stroke="#2c2f37"/>
        <text x="160" y="14" font-family="Inter, system-ui, sans-serif" font-size="8" font-weight="700" fill="#7c7f86" letter-spacing="2">MARGIN</text>
        <text x="160" y="30" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" fill="#22c55e">28.4%</text>
      </g>
    </g>
  </g>

  <!-- Top-left chip -->
  <g transform="translate(40 40)">
    <rect width="128" height="30" rx="6" fill="#0f1115" stroke="#26282e"/>
    <circle cx="14" cy="15" r="5" fill="#3b82f6"/>
    <text x="26" y="20" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#dbeafe">REPORT</text>
    <text x="86" y="20" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#a3a6ad">Q4</text>
  </g>
  <g font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#a3a6ad" letter-spacing="2">
    <text x="40" y="450">FILED · ANNUAL · 10-K</text>
  </g>
</svg>
