<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgDonut" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d111a"/>
      <stop offset="100%" stop-color="#181b25"/>
    </linearGradient>
    <radialGradient id="donutGlow" cx="0.5" cy="0.55" r="0.4">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <filter id="donutShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="6"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bgDonut)"/>
  <rect width="800" height="500" fill="url(#donutGlow)"/>

  <!-- Donut. Circumference at r=140 ≈ 879.6. Distribute segments by % of total. -->
  <g transform="translate(380 270)" filter="url(#donutShadow)">
    <!-- Tech 30% -->
    <circle r="140" fill="none" stroke="#3b82f6" stroke-width="58" stroke-dasharray="263.9 879.6" transform="rotate(-90)"/>
    <!-- Healthcare 22% -->
    <circle r="140" fill="none" stroke="#22c55e" stroke-width="58" stroke-dasharray="193.5 879.6" stroke-dashoffset="-263.9" transform="rotate(-90)"/>
    <!-- Financials 18% -->
    <circle r="140" fill="none" stroke="#fbbf24" stroke-width="58" stroke-dasharray="158.3 879.6" stroke-dashoffset="-457.4" transform="rotate(-90)"/>
    <!-- Consumer 14% -->
    <circle r="140" fill="none" stroke="#ef4444" stroke-width="58" stroke-dasharray="123.1 879.6" stroke-dashoffset="-615.7" transform="rotate(-90)"/>
    <!-- Energy 9% -->
    <circle r="140" fill="none" stroke="#a855f7" stroke-width="58" stroke-dasharray="79.2 879.6"  stroke-dashoffset="-738.8" transform="rotate(-90)"/>
    <!-- Other 7% -->
    <circle r="140" fill="none" stroke="#94a3b8" stroke-width="58" stroke-dasharray="61.5 879.6"  stroke-dashoffset="-818.0" transform="rotate(-90)"/>

    <!-- Inner ring shadow -->
    <circle r="115" fill="none" stroke="#0a0c10" stroke-width="2" opacity="0.6"/>
    <!-- Center -->
    <circle r="108" fill="#13151a"/>
    <text text-anchor="middle" y="-8" fill="#a3a6ad" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="2">SECTOR MIX</text>
    <text text-anchor="middle" y="22" fill="#f5f5f5" font-family="Inter, system-ui, sans-serif" font-size="32" font-weight="800">30%</text>
    <text text-anchor="middle" y="46" fill="#60a5fa" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">TECH LEADS</text>
  </g>

  <!-- Right-side legend -->
  <g font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#d1d5db">
    <g transform="translate(580 130)">
      <rect width="10" height="10" rx="2" fill="#3b82f6"/>
      <text x="20" y="9">Technology</text>
      <text x="170" y="9" text-anchor="end" fill="#a3a6ad" font-weight="500">30%</text>
    </g>
    <g transform="translate(580 158)">
      <rect width="10" height="10" rx="2" fill="#22c55e"/>
      <text x="20" y="9">Healthcare</text>
      <text x="170" y="9" text-anchor="end" fill="#a3a6ad" font-weight="500">22%</text>
    </g>
    <g transform="translate(580 186)">
      <rect width="10" height="10" rx="2" fill="#fbbf24"/>
      <text x="20" y="9">Financials</text>
      <text x="170" y="9" text-anchor="end" fill="#a3a6ad" font-weight="500">18%</text>
    </g>
    <g transform="translate(580 214)">
      <rect width="10" height="10" rx="2" fill="#ef4444"/>
      <text x="20" y="9">Consumer</text>
      <text x="170" y="9" text-anchor="end" fill="#a3a6ad" font-weight="500">14%</text>
    </g>
    <g transform="translate(580 242)">
      <rect width="10" height="10" rx="2" fill="#a855f7"/>
      <text x="20" y="9">Energy</text>
      <text x="170" y="9" text-anchor="end" fill="#a3a6ad" font-weight="500">9%</text>
    </g>
    <g transform="translate(580 270)">
      <rect width="10" height="10" rx="2" fill="#94a3b8"/>
      <text x="20" y="9">Other</text>
      <text x="170" y="9" text-anchor="end" fill="#a3a6ad" font-weight="500">7%</text>
    </g>
  </g>

  <g transform="translate(40 40)">
    <rect width="138" height="30" rx="6" fill="#0f1115" stroke="#26282e"/>
    <circle cx="14" cy="15" r="5" fill="#3b82f6"/>
    <text x="26" y="20" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#dbeafe">ALLOCATION</text>
  </g>
</svg>
