<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e1320"/>
      <stop offset="50%" stop-color="#13151c"/>
      <stop offset="100%" stop-color="#06070a"/>
    </linearGradient>
    <radialGradient id="moon" cx="0.78" cy="0.20" r="0.18">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="haze" cx="0.5" cy="0.85" r="0.7">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="reflection" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bgSky)"/>
  <rect width="800" height="500" fill="url(#moon)"/>
  <circle cx="624" cy="100" r="22" fill="#fde68a" opacity="0.85"/>
  <rect width="800" height="500" fill="url(#haze)"/>

  <!-- Stars -->
  <g fill="#cbd5e1" opacity="0.7">
    <circle cx="120" cy="60"  r="0.8"/>
    <circle cx="200" cy="40"  r="0.6"/>
    <circle cx="320" cy="80"  r="1.0"/>
    <circle cx="450" cy="50"  r="0.7"/>
    <circle cx="710" cy="40"  r="1.1"/>
    <circle cx="760" cy="90"  r="0.8"/>
    <circle cx="80"  cy="110" r="0.7"/>
    <circle cx="540" cy="30"  r="0.6"/>
  </g>

  <!-- Far skyline (lightest) -->
  <g fill="#1c2030">
    <rect x="20"  y="290" width="42" height="170"/>
    <rect x="68"  y="270" width="56" height="190"/>
    <rect x="130" y="300" width="36" height="160"/>
    <rect x="172" y="240" width="68" height="220"/>
    <rect x="246" y="280" width="42" height="180"/>
    <rect x="294" y="220" width="64" height="240"/>
    <rect x="364" y="260" width="48" height="200"/>
    <rect x="418" y="240" width="56" height="220"/>
    <rect x="480" y="290" width="40" height="170"/>
    <rect x="526" y="250" width="62" height="210"/>
    <rect x="594" y="280" width="46" height="180"/>
    <rect x="646" y="240" width="58" height="220"/>
    <rect x="710" y="280" width="42" height="180"/>
    <rect x="758" y="260" width="42" height="200"/>
  </g>

  <!-- Mid skyline -->
  <g fill="#10141c">
    <rect x="0"   y="330" width="60" height="130"/>
    <rect x="64"  y="310" width="74" height="150"/>
    <rect x="142" y="300" width="58" height="160"/>
    <rect x="204" y="260" width="84" height="200"/>
    <rect x="292" y="320" width="60" height="140"/>
    <rect x="356" y="280" width="76" height="180"/>
    <rect x="436" y="320" width="56" height="140"/>
    <rect x="496" y="290" width="74" height="170"/>
    <rect x="574" y="320" width="60" height="140"/>
    <rect x="638" y="280" width="80" height="180"/>
    <rect x="722" y="320" width="78" height="140"/>
  </g>

  <!-- Foreground skyline (darkest) -->
  <g fill="#06070a">
    <rect x="20"  y="380" width="80" height="80"/>
    <rect x="100" y="350" width="92" height="110"/>
    <rect x="196" y="370" width="68" height="90"/>
    <rect x="268" y="300" width="100" height="160"/>
    <rect x="372" y="340" width="84" height="120"/>
    <rect x="460" y="280" width="100" height="180"/>
    <rect x="564" y="350" width="74" height="110"/>
    <rect x="642" y="320" width="90" height="140"/>
    <rect x="736" y="370" width="64" height="90"/>
  </g>

  <!-- Antennas -->
  <g stroke="#06070a" stroke-width="2">
    <line x1="146" y1="350" x2="146" y2="320"/>
    <line x1="318" y1="300" x2="318" y2="270"/>
    <line x1="510" y1="280" x2="510" y2="240"/>
    <line x1="687" y1="320" x2="687" y2="290"/>
  </g>
  <g fill="#ef4444">
    <circle cx="146" cy="320" r="2"/>
    <circle cx="318" cy="270" r="2"/>
    <circle cx="510" cy="240" r="2"/>
    <circle cx="687" cy="290" r="2"/>
  </g>

  <!-- Lit windows: small blue dots in patterns -->
  <g fill="#3b82f6">
    <rect x="118" y="370" width="3" height="5"/>
    <rect x="128" y="370" width="3" height="5"/>
    <rect x="138" y="370" width="3" height="5"/>
    <rect x="118" y="386" width="3" height="5"/>
    <rect x="138" y="386" width="3" height="5"/>
    <rect x="118" y="402" width="3" height="5"/>
    <rect x="128" y="402" width="3" height="5"/>

    <rect x="284" y="320" width="3" height="5"/>
    <rect x="298" y="320" width="3" height="5"/>
    <rect x="312" y="320" width="3" height="5"/>
    <rect x="326" y="320" width="3" height="5"/>
    <rect x="284" y="338" width="3" height="5"/>
    <rect x="312" y="338" width="3" height="5"/>
    <rect x="284" y="356" width="3" height="5"/>
    <rect x="298" y="356" width="3" height="5"/>
    <rect x="326" y="356" width="3" height="5"/>

    <rect x="478" y="298" width="3" height="5"/>
    <rect x="494" y="298" width="3" height="5"/>
    <rect x="512" y="298" width="3" height="5"/>
    <rect x="530" y="298" width="3" height="5"/>
    <rect x="478" y="316" width="3" height="5"/>
    <rect x="512" y="316" width="3" height="5"/>
    <rect x="478" y="334" width="3" height="5"/>
    <rect x="494" y="334" width="3" height="5"/>
    <rect x="512" y="334" width="3" height="5"/>
    <rect x="530" y="334" width="3" height="5"/>

    <rect x="660" y="338" width="3" height="5"/>
    <rect x="676" y="338" width="3" height="5"/>
    <rect x="692" y="338" width="3" height="5"/>
    <rect x="660" y="358" width="3" height="5"/>
    <rect x="692" y="358" width="3" height="5"/>
    <rect x="676" y="378" width="3" height="5"/>
  </g>

  <!-- Subtle horizon reflection band -->
  <rect x="0" y="455" width="800" height="45" fill="url(#reflection)"/>

  <g transform="translate(40 40)">
    <rect width="118" height="30" rx="6" fill="#0f1115" stroke="#26282e"/>
    <circle cx="14" cy="15" r="5" fill="#3b82f6"/>
    <text x="26" y="20" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#dbeafe">FINANCE</text>
  </g>
  <g font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#a3a6ad" letter-spacing="2">
    <text x="760" y="58" text-anchor="end">DOWNTOWN</text>
  </g>
</svg>
