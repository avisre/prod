name: Weekly complete-universe financial reconciliation
on:
  schedule:
    # Sunday 04:00 Asia/Kolkata = Saturday 22:30 UTC.
    - cron: '30 22 * * 6'
  workflow_dispatch:
    inputs:
      resume_run_id:
        description: 'Optional failed weekly run ID whose checkpoint should be resumed'
        required: false
permissions:
  contents: write
  actions: read
concurrency:
  group: refresh-fundamentals
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      SEC_COVERAGE_DISABLE_ON_DEMAND: '1'
      DISABLE_BACKGROUND_JOBS: '1'
      SEC_ORIGINAL_MAX_MB: '64'
      RENDER_SERVICE: srv-d4kc6schg0os73al6t10
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      PUBLIC_FINANCIAL_CACHE_URI: ${{ secrets.PUBLIC_FINANCIAL_CACHE_URI }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci && npm ci --prefix backend
      - name: Record rollback baseline
        run: git rev-parse HEAD > /tmp/financial-baseline-sha
      - name: Resume approved weekly checkpoint
        if: inputs.resume_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
        run: |
          [[ "$RESUME_RUN_ID" =~ ^[0-9]+$ ]]
          gh run download "$RESUME_RUN_ID" -n "financial-checkpoint-$RESUME_RUN_ID" -D /tmp/financial-resume
          test -f /tmp/financial-resume/sec-reporting.json
          cp -R /tmp/financial-resume/. frontend/data/
      - name: Select a dated reconciliation cycle
        env:
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
        run: |
          node -e 'const fs=require("node:fs");const date=process.env.RESUME_RUN_ID?JSON.parse(fs.readFileSync("frontend/data/sec-reporting.json","utf8")).asOf:new Date().toISOString().slice(0,10);if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||Date.now()-Date.parse(date)>7*86400000)throw new Error("Invalid or expired weekly checkpoint");fs.appendFileSync(process.env.GITHUB_ENV,"FINANCIAL_AS_OF="+date+"\n");'
      - name: Reconcile authoritative listings
        run: node scripts/run-financial-stage.js listings
      - name: Reconcile every issuer; checkpoint every 20
        run: node --max-old-space-size=1536 scripts/run-financial-stage.js core
      - name: Retry incomplete issuers in the same cycle
        run: node --max-old-space-size=1536 scripts/run-financial-stage.js core
      - name: Preserve superseded incompatible evidence
        run: node scripts/normalize-financial-source-ids.js
      - name: Refresh fund and ambiguous issuer identities
        run: node scripts/run-financial-stage.js identities
      - name: Confirm classifications using refreshed SEC identities
        run: node scripts/run-financial-stage.js listings
      - name: Reconcile identities newly classified as stocks
        run: node --max-old-space-size=1536 scripts/run-financial-stage.js core
      - name: Revalidate the final classified financial universe
        run: node scripts/normalize-financial-source-ids.js
      - name: Extract original industry and segment disclosures
        run: node --max-old-space-size=1536 scripts/run-financial-stage.js industry
      - name: Retry transient original-document failures
        run: node --max-old-space-size=1536 scripts/run-financial-stage.js industry-retry
      - name: Promote validated public request additions
        run: node scripts/run-financial-stage.js promote
      - name: Refresh optional currency presentation
        run: node scripts/refresh-sec-fx.js
      - name: Build and validate one generation
        run: |
          node --max-old-space-size=1536 scripts/build-public-stock-index.js
          node scripts/build-screen-index.js
          node scripts/build-industry-map.js
          node scripts/test-stock-coverage.js
          node scripts/validate-stock-coverage.js --bootstrap
          node scripts/verify-public-stock-pages.js
          node --max-old-space-size=256 scripts/check-stock-coverage-performance.js
      - name: Preserve interrupted checkpoint
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: financial-checkpoint-${{ github.run_id }}
          retention-days: 14
          path: |
            frontend/data/sec-reporting.json
            frontend/data/sec-financials/
            frontend/data/us-companies.json
            frontend/data/stock-universe-manifest.json
            frontend/data/legacy-instruments.json
            frontend/data/supplemental-financials/
      - name: Publish validated generation
        run: |
          git config user.name stockportfolio-bot
          git config user.email bot@stockportfolio.pro
          git add frontend/data/sec-reporting.json frontend/data/sec-financials/ frontend/data/sec-fx.json frontend/data/us-companies.json frontend/data/stock-universe-manifest.json frontend/data/legacy-instruments.json frontend/data/public-stock-index.json frontend/data/financial-reporting-index.json frontend/data/screen-index.json frontend/data/financial-coverage.json frontend/data/financial-coverage-summary.json frontend/data/industry-map.json
          if [ -d frontend/data/supplemental-financials ]; then git add frontend/data/supplemental-financials/; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: weekly complete-universe financial reconciliation"
          git push origin HEAD:main
