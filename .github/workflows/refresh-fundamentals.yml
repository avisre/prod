name: Weekly complete-universe financial reconciliation
on:
  schedule:
    # Saturday 07:30 Asia/Kolkata = Saturday 02:00 UTC, after Friday's close and the
    # Saturday 01:30 UTC quotes run. Nothing is scheduled on Sunday (owner, 2026-10-18).
    - cron: '0 2 * * 6'
  workflow_dispatch:
    inputs:
      resume_run_id:
        description: 'Optional failed weekly run ID whose checkpoint should be resumed'
        required: false
permissions:
  contents: write
  actions: read
concurrency:
  group: refresh-fundamentals
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      SEC_COVERAGE_DISABLE_ON_DEMAND: '1'
      DISABLE_BACKGROUND_JOBS: '1'
      SEC_ORIGINAL_MAX_MB: '64'
      RENDER_SERVICE: srv-d4kc6schg0os73al6t10
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      PUBLIC_FINANCIAL_CACHE_URI: ${{ secrets.PUBLIC_FINANCIAL_CACHE_URI }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci && npm ci --prefix backend
      - name: Record rollback baseline
        run: git rev-parse HEAD > /tmp/financial-baseline-sha
      - name: Resume approved weekly checkpoint
        if: inputs.resume_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
        run: |
          [[ "$RESUME_RUN_ID" =~ ^[0-9]+$ ]]
          gh run download "$RESUME_RUN_ID" -n "financial-checkpoint-$RESUME_RUN_ID" -D /tmp/financial-resume
          test -f /tmp/financial-resume/sec-reporting.json
          cp -R /tmp/financial-resume/. frontend/data/
      - name: Select a dated reconciliation cycle
        env:
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
        run: |
          node -e 'const fs=require("node:fs");const date=process.env.RESUME_RUN_ID?JSON.parse(fs.readFileSync("frontend/data/sec-reporting.json","utf8")).asOf:new Date().toISOString().slice(0,10);if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||Date.now()-Date.parse(date)>7*86400000)throw new Error("Invalid or expired weekly checkpoint");fs.appendFileSync(process.env.GITHUB_ENV,"FINANCIAL_AS_OF="+date+"\n");'
      # Banks with no holding company (TOWN, HIFS, NBN, FRBA, SSBI, RCBC, ASBH) file with their bank regulator,
      # not the SEC; their statements are the FDIC Call Report. Run before the stages that reconcile the
      # supplemental store and build the indexes, so both carry this week's records. A changed FDIC match or
      # an FDIC outage keeps last week's rows and must not hold back the SEC statements.
      - name: Refresh FDIC Call Reports for regulator-filing banks
        continue-on-error: true
        run: node scripts/fetch-fdic-financials.js
      - name: Reconcile authoritative listings
        run: node scripts/run-financial-stage.js listings
      - name: Reconcile every issuer; checkpoint every 20
        run: node --max-old-space-size=1536 scripts/run-financial-stage.js core
      - name: Retry incomplete issuers in the same cycle
        run: node --max-old-space-size=1536 scripts/run-financial-stage.js core
      - name: Preserve superseded incompatible evidence
        run: node scripts/normalize-financial-source-ids.js
      - name: Refresh fund and ambiguous issuer identities
        run: node scripts/run-financial-stage.js identities
      - name: Confirm classifications using refreshed SEC identities
        run: node scripts/run-financial-stage.js listings
      - name: Reconcile identities newly classified as stocks
        run: node --max-old-space-size=1536 scripts/run-financial-stage.js core
      - name: Revalidate the final classified financial universe
        run: node scripts/normalize-financial-source-ids.js
      - name: Extract original industry and segment disclosures
        run: node --max-old-space-size=1536 scripts/run-financial-stage.js industry
      - name: Retry transient original-document failures
        run: node --max-old-space-size=1536 scripts/run-financial-stage.js industry-retry
      - name: Promote validated public request additions
        run: node scripts/run-financial-stage.js promote
      # The per-filing facts behind the segment history (71 MB for 166 issuers, 11-06) are not committed.
      # Cold, a full build reads ~6,900 filings (~2.8 h serial); with the cache only the new filings are read.
      - name: Restore segment-history filing cache
        uses: actions/cache@v4
        with:
          path: backend/data/segment-history/.cache
          key: segment-history-${{ github.run_id }}
          restore-keys: segment-history-
      # Refreshes the issuers that already have a history table. A failure here leaves last week's tables in
      # place and must not hold back the statements. Only issuers that filed a report since their table was
      # built are read; the budget keeps a cold cache (3,733 issuers, ~750 MB, built locally 11-06) from
      # running into the job's 360-minute limit: it warms a slice each week, the rest keep their tables.
      - name: Refresh product-segment history
        continue-on-error: true
        timeout-minutes: 120
        run: |
          node -e 'const fs=require("fs");fs.writeFileSync("/tmp/segment-ciks.json",JSON.stringify(fs.readdirSync("backend/data/segment-history").filter(f=>/^\d{10}\.json$/.test(f)).map(f=>f.slice(0,10))))'
          node --max-old-space-size=1536 scripts/refresh-segment-history.js --ciks-file /tmp/segment-ciks.json --jobs 4 --budget-minutes 100
      - name: Refresh optional currency presentation
        run: node scripts/refresh-sec-fx.js
      # test-stock-coverage.js copies frontend/data (6+ GB) into /tmp; on 2026-10-24 the
      # runner ran out of disk there and the whole reconciled generation went unpublished.
      - name: Free runner disk for the isolated test copy
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h / /tmp
      - name: Build and validate one generation
        run: |
          node --max-old-space-size=1536 scripts/build-public-stock-index.js
          node scripts/build-screen-index.js
          node scripts/build-industry-map.js
          node scripts/test-stock-coverage.js
          node scripts/validate-stock-coverage.js --bootstrap
          node scripts/verify-public-stock-pages.js
          node --max-old-space-size=256 scripts/check-stock-coverage-performance.js
      - name: Preserve interrupted checkpoint
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: financial-checkpoint-${{ github.run_id }}
          retention-days: 14
          path: |
            frontend/data/sec-reporting.json
            frontend/data/sec-financials/
            frontend/data/us-companies.json
            frontend/data/stock-universe-manifest.json
            frontend/data/legacy-instruments.json
            frontend/data/supplemental-financials/
      - name: Publish validated generation
        run: |
          git config user.name stockportfolio-bot
          git config user.email bot@stockportfolio.pro
          # Publish the portfolio alert scan only with this validated weekly generation.
          # The deployed service claims the week once, so restarts do not rescan it.
          node scripts/write-weekly-watchdog-cycle.js
          git add frontend/data/weekly-watchdog.json
          git add frontend/data/sec-reporting.json frontend/data/sec-financials/ frontend/data/sec-fx.json frontend/data/us-companies.json frontend/data/stock-universe-manifest.json frontend/data/legacy-instruments.json frontend/data/public-stock-index.json frontend/data/financial-reporting-index.json frontend/data/screen-index.json frontend/data/screen-facts.json frontend/data/financial-coverage.json frontend/data/financial-coverage-summary.json frontend/data/industry-map.json
          if [ -d frontend/data/supplemental-financials ]; then git add frontend/data/supplemental-financials/; fi
          git add backend/data/segment-history/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: weekly complete-universe financial reconciliation"
          git push origin HEAD:main
