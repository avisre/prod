name: Refresh fundamentals cache

# Pulls fresh fundamentals from Yahoo Finance + SEC filings for every symbol in
# frontend/data/sp500-companies.json (or top-100-companies.json if that
# isn't present yet) and force-pushes the result to a dedicated branch.
# Force-pushing keeps git history flat so the data churn doesn't bloat
# the repo over time.

on:
  schedule:
    # Weekly: Saturday 22:30 UTC, after the trading week is fully settled.
    # (Was nightly on weekdays — weekly is enough for filed fundamentals
    # and cuts Alpha Vantage usage ~5x.)
    - cron: '30 22 * * 6'
  workflow_dispatch:
    inputs:
      max_symbols:
        description: 'Cap symbols processed (0 = all)'
        required: false
        default: '0'

permissions:
  contents: write

concurrency:
  group: refresh-fundamentals
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix backend

      - name: Update S&P 500 symbol list
        run: node scripts/build-sp500-list.js

      - name: Refresh fundamentals JSON files
        env:
          MAX_SYMBOLS: ${{ github.event.inputs.max_symbols || '0' }}
        run: node scripts/refresh-fundamentals.js frontend/data/sp500-companies.json

      # refresh-fundamentals.js queues the pages whose *filed* statements changed.
      # The queue lives outside frontend/data/, is gitignored, and is never staged,
      # so it must be sent in the same job or it is discarded with the runner.
      # (Until 2026-09-28 a stale copy was tracked in git while this comment claimed
      # otherwise; it was untracked so the file's status now matches the comment.)
      # Bing consumes IndexNow; Google does not. Non-blocking: a failed submission
      # must never fail the data refresh.
      #
      # Note this step reports success on the POST alone. IndexNow fetches the key
      # file asynchronously afterwards, so a 403 there was invisible -- see the
      # bot-blocker exemption and backend/test/indexnow-key.test.js.
      - name: Submit changed pages to IndexNow
        continue-on-error: true
        run: |
          node scripts/seo/indexnow-queue.js status || true
          node scripts/indexnow-ping.js --queue || true

      - name: Configure git
        run: |
          git config user.name  'stockportfolio-bot'
          git config user.email 'bot@stockportfolio.pro'

      - name: Stage data folder
        run: |
          # fundamentals-changed.json MUST be staged: backend/seo-pages.js reads it
          # to date <lastmod>. If it stops reaching production the sitemap freezes
          # on its bundled snapshot date again, which is exactly the bug this
          # manifest exists to fix -- and it would fail silently, the same way the
          # deploy-mtime clamp did.
          git add frontend/data/sp500-companies.json \
                  frontend/data/top-100-fundamentals-index.json \
                  frontend/data/fundamentals-changed.json \
                  frontend/data/fundamentals/
          if git diff --cached --quiet; then
            echo "no_changes=true" >> $GITHUB_ENV
          fi

      - name: Commit + push to main
        if: env.no_changes != 'true'
        run: |
          # No [skip ci] here on purpose. The fundamentals store is served from
          # the deployed filesystem, so refreshed data only reaches production
          # via a deploy — skipping CI would leave the site on last week's
          # numbers indefinitely. This push is what triggers deploy-render.yml.
          git commit -m "data: refresh fundamentals cache ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push origin main
