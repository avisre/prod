name: Debug read-only Render env + logs

# TEMPORARY diagnostic workflow, removed after this one-shot run. Reads the
# service's env-var NAMES (values redacted except non-secret pricing config)
# plus recent service logs, to diagnose why /api/credits/topup refuses on prod.
# Dispatch-only; never runs on push.

on:
  workflow_dispatch:

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RENDER_SERVICE: srv-d4kc6schg0os73al6t10
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
    steps:
      - name: Env var names + topup config (values redacted)
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/env.json -w '%{http_code}' \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Accept: application/json" \
            "https://api.render.com/v1/services/$RENDER_SERVICE/env-vars" || echo 000)
          echo "GET env-vars -> $code"
          if [ "$code" != "200" ]; then head -c 400 /tmp/env.json; exit 1; fi
          echo "--- env var NAMES configured on the service:"
          jq -r '.[].envVar.key' /tmp/env.json | sort
          echo "--- topup-related values (non-secret):"
          jq -r '.[].envVar | select(.key=="STRIPE_PRICE_ID_CREDITS_TOPUP" or .key=="CREDIT_TOPUP_PRICE" or .key=="CREDIT_TOPUP_CREDITS") | "\(.key) = \(.value)"' /tmp/env.json
          echo "--- presence-only for secret keys:"
          for k in STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET STRIPE_PUBLISHABLE_KEY; do
            if grep -q "\"key\": *\"$k\"" /tmp/env.json; then echo "$k: SET"; else echo "$k: MISSING"; fi
          done

      - name: Recent service logs (credits-relevant lines)
        run: |
          OWNER=$(curl -sS \
            -H "Authorization: Bearer $RENDER_API_KEY" -H "Accept: application/json" \
            "https://api.render.com/v1/services/$RENDER_SERVICE" | jq -r '.ownerId // empty')
          echo "ownerId: $OWNER"
          # walk backward through the owner's 9/7 evening session (17:00-19:20Z)
          # and the last day, collecting up to 400 log lines
          end=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          start=$(date -u -d '36 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          : > /tmp/all.log
          for page in 1 2 3 4; do
            code=$(curl -sS -o /tmp/logs.json -w '%{http_code}' \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H "Accept: application/json" \
              "https://api.render.com/v1/logs?limit=100&direction=backward&ownerId=${OWNER}&resource=$RENDER_SERVICE&startTime=${start}&endTime=${end}" || echo 000)
            echo "page $page ($start..$end) -> $code"
            if [ "$code" != "200" ]; then head -c 400 /tmp/logs.json || true; break; fi
            jq -r '.logs[].message' /tmp/logs.json >> /tmp/all.log 2>/dev/null || true
            more=$(jq -r '.hasMore // false' /tmp/logs.json)
            next=$(jq -r '.nextEndTime // empty' /tmp/logs.json)
            echo "  hasMore=$more nextEndTime=$next"
            if [ "$more" != "true" ] || [ -z "$next" ]; then break; fi
            end=$next
          done
          echo "--- total collected lines: $(wc -l < /tmp/all.log)"
          echo "--- lines mentioning credits/topup/recharge/checkout:"
          grep -i -E "topup|recharge|misconfigured|credits" /tmp/all.log | head -60 || echo "(none)"
          echo "--- non-2xx http-status lines:"
          grep -E "http-status.*(4[0-9][0-9]|5[0-9][0-9])" /tmp/all.log | sort | uniq -c | sort -rn | head -25 || echo "(none)"