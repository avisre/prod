name: Deploy to Render

# This workflow does ONE thing: it makes sure the newest commit on main is live
# on Render. It runs no tests and validates nothing.
#
# The deploy checks moved off GitHub on 2026-10-10 (owner decision). Until then
# a "validate" job here ran them on every push, about 23 minutes each time
# whatever had changed, and a push from the data bot during that window left a
# fully validated commit undeployed. They now run on the developer's machine
# before the push: scripts/predeploy.js, started automatically by the pre-push
# hook in .githooks/ (enable once per clone: git config core.hooksPath .githooks).
# It runs only the tests a change can affect, and each stock-data check only
# when that check's own inputs changed. The data-refresh workflows validate
# their own output before they commit, so they do not depend on this either.
#
# Two things deploy a push to main. Render's own Auto-Deploy ships the commit in
# about 4 minutes. This workflow then confirms that commit is live through
# Render's API, and deploys it itself when Auto-Deploy did not fire.
#
#   - a new push cancels the older run (concurrency below), and
#   - the deploy job refuses to deploy a commit that is no longer the head of
#     main, and skips the redundant redeploy when Render is already live on it.
#
# Render must be able to read the repository. While the repository is private
# and the Render workspace has no GitHub connection, every deploy fails with
# "service ... does not have a commit <sha>" (2026-10-06 and 2026-10-10).
#
# The weekly fundamentals refresh MUST deploy, which is why its commit no longer
# carries [skip ci] (GitHub skips workflow runs for those). The store under
# frontend/data/fundamentals/ is read from the deployed filesystem, so refreshed
# data reaches production only by shipping a new build.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: render-deploy
  # The newest commit contains every older one, so validating and deploying an
  # older run only costs time and risks redeploying stale code.
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      RENDER_SERVICE: srv-d4kc6schg0os73al6t10
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Trigger deploy and wait for it to go live
        run: |
          set -euo pipefail

          if [ -z "${RENDER_API_KEY:-}" ]; then
            echo "::error::RENDER_API_KEY secret is not set — add it in repo Settings > Secrets"
            exit 1
          fi

          # Render answers 404 both for "no such service" and "this key cannot see
          # that service", and `curl -f` throws the body away — so a failing deploy
          # used to report nothing but "curl: (22) ... 404". Ask the key what it can
          # actually reach before trying to deploy, and print Render's own message.
          preflight() {
            code=$(curl -sS -o /tmp/render-services.json -w '%{http_code}' \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H "Accept: application/json" \
              "https://api.render.com/v1/services?limit=50" || echo 000)
            echo "GET /v1/services -> $code"
            if [ "$code" != "200" ]; then
              echo "::error::Render rejected RENDER_API_KEY (HTTP $code). Create an account-level key at https://dashboard.render.com/u/settings#api-keys and re-set it with: gh secret set RENDER_API_KEY"
              head -c 400 /tmp/render-services.json || true
              return 1
            fi
            echo "services this key can see:"
            jq -r '.[] | (.service // .) | "  \(.id)  \(.name)"' /tmp/render-services.json || true
            if ! grep -q "$RENDER_SERVICE" /tmp/render-services.json; then
              echo "::error::The key is valid but cannot see $RENDER_SERVICE — it belongs to a different Render workspace, or the service id in this workflow is stale. Pick the right id from the list above."
              return 1
            fi
          }

          trigger() {
            body=$(mktemp)
            code=$(curl -sS -o "$body" -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H "Content-Type: application/json" \
              -d "$(jq -nc --arg sha "$GITHUB_SHA" '{clearCache:"do_not_clear",commitId:$sha}')" \
              "https://api.render.com/v1/services/$RENDER_SERVICE/deploys" || echo 000)
            # stdout is captured by the caller as the deploy id, so diagnostics go to stderr.
            if [ "$code" != "200" ] && [ "$code" != "201" ] && [ "$code" != "202" ]; then
              echo "::error::deploy trigger returned HTTP $code" >&2
              head -c 400 "$body" >&2 || true
              echo >&2
              return 1
            fi
            jq -r '.id // .deploy.id' "$body"
          }

          poll() {
            id="$1"
            for _ in $(seq 1 100); do
              sleep 10
              status=$(curl -fsS \
                -H "Authorization: Bearer $RENDER_API_KEY" \
                "https://api.render.com/v1/services/$RENDER_SERVICE/deploys/$id" \
                | jq -r '.status // .deploy.status // empty')
              echo "  $id -> ${status:-unknown}"
              case "$status" in
                live)
                  deployed_sha=$(curl -fsS -H "Authorization: Bearer $RENDER_API_KEY" "https://api.render.com/v1/services/$RENDER_SERVICE/deploys/$id" | jq -r '.commit.id // .deploy.commit.id // empty')
                  [ "$deployed_sha" = "$GITHUB_SHA" ] || { echo "::error::Deployed SHA $deployed_sha differs from validated $GITHUB_SHA"; return 1; }
                  return 0 ;;
                build_failed|update_failed|pre_deploy_failed|canceled) return 1 ;;
              esac
            done
            echo "::error::timed out after ~17 minutes waiting on $id"
            return 1
          }

          # A push run only deploys the commit that is still the head of main.
          # If main has moved on, the newer commit's run owns the deploy; this
          # one deploying would put older code back in production. A manual
          # dispatch is left alone so an operator can still redeploy on purpose.
          # An unreadable head is treated as "moved on": skipping is safe because
          # Auto-Deploy has already shipped the commit, deploying blind is not.
          still_head() {
            [ "${GITHUB_EVENT_NAME:-}" = "push" ] || return 0
            head_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
            if [ "$head_sha" != "$GITHUB_SHA" ]; then
              echo "::notice::main is now ${head_sha::8}; not deploying the older ${GITHUB_SHA::8}"
              return 1
            fi
          }

          # Render's Auto-Deploy usually has this commit live long before
          # validation ends. Redeploying it would only restart the service, so
          # skip when the newest Render deploy is live on exactly this commit.
          # Any doubt (unexpected response, another status) falls through to a
          # normal deploy.
          already_live() {
            latest=$(curl -fsS -H "Authorization: Bearer $RENDER_API_KEY" -H "Accept: application/json" \
              "https://api.render.com/v1/services/$RENDER_SERVICE/deploys?limit=1" \
              | jq -r '(.[0] // empty) | (.deploy // .) | "\(.status // "") \(.commit.id // "")"' 2>/dev/null || true)
            echo "newest Render deploy: ${latest:-unknown}"
            [ "$latest" = "live $GITHUB_SHA" ]
          }

          still_head || exit 0

          preflight

          if already_live; then
            echo "Render is already live on ${GITHUB_SHA::8}; nothing to deploy"
            exit 0
          fi

          id="$(trigger)"
          echo "triggered deploy $id for ${GITHUB_SHA::8}"
          if poll "$id"; then
            echo "deployed $id"
            exit 0
          fi

          # Render's first build after a push intermittently reports build_failed
          # in ~50s with no error in the log. One retry clears it; a second
          # failure is a real one and should stop the run.
          echo "::warning::first attempt failed — retrying once (known Render flake)"
          id="$(trigger)"
          echo "retry deploy $id"
          poll "$id"
          echo "deployed $id on retry"
