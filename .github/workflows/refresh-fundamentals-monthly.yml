name: Legacy financial refresh redirect
# Monthly rotation is retired; manual runs use the same weekly reconciler.
on:
  workflow_dispatch:
permissions:
  actions: write
  contents: read
jobs:
  redirect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: gh workflow run refresh-fundamentals.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
