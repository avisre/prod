name: Refresh quotes cache

# Prices change every session, fundamentals don't. This job writes
# frontend/data/quotes.json — a price-only snapshot behind backend/quote-store.js
# — so crawlers, cold renders and Yahoo outages see a close that is at most one
# session old. Live quotes still come from Yahoo per request.
#
# Runs Tue–Sat at 01:30 UTC, after the US session (20:00/21:00 UTC) has settled,
# covering Mon–Fri sessions. Cheap: batched quote calls only, no SEC pulls.

on:
  schedule:
    - cron: '30 1 * * 2-6'
  workflow_dispatch:
    inputs:
      max_symbols:
        description: 'Cap symbols processed (0 = all)'
        required: false
        default: '0'

permissions:
  contents: write

concurrency:
  group: refresh-fundamentals
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix backend


      - name: Refresh quote snapshot
        env:
          MAX_SYMBOLS: ${{ github.event.inputs.max_symbols || '0' }}
        run: node scripts/refresh-quotes.js frontend/data/us-companies.json

      # Descriptions, sector and industry for companies that have none; at most
      # 1,500 symbols a day, so the backlog clears in two runs and then idles.
      - name: Refresh missing company profiles
        continue-on-error: true
        run: node scripts/refresh-profiles.js frontend/data/us-companies.json

      - name: Build consistent public and screen snapshots
        run: |
          node --max-old-space-size=1536 scripts/build-public-stock-index.js
          node scripts/build-screen-index.js
          node scripts/validate-stock-coverage.js

      - name: Configure git
        run: |
          git config user.name  'stockportfolio-bot'
          git config user.email 'bot@stockportfolio.pro'

      - name: Stage quote file
        run: |
          if [ -f frontend/data/company-profiles.json ]; then git add frontend/data/company-profiles.json; fi
          git add frontend/data/quotes.json frontend/data/us-companies.json frontend/data/public-stock-index.json frontend/data/screen-index.json frontend/data/screen-facts.json frontend/data/financial-coverage.json frontend/data/financial-coverage-summary.json frontend/data/financial-reporting-index.json
          if git diff --cached --quiet; then
            echo "no_changes=true" >> $GITHUB_ENV
          fi

      - name: Commit + push to main
        if: env.no_changes != 'true'
        run: |
          # No [skip ci] on purpose: the snapshot is served from the deployed
          # filesystem, so it only reaches production via a deploy — the same
          # reason refresh-fundamentals.yml does not skip CI. This push is what
          # triggers deploy-render.yml.
          git commit -m "data: refresh quotes snapshot ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push origin main
